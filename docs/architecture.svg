  <text x="712" y="143" font-size="8.5" fill="#0E7A63" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif">local ONNX · Voyage</text>

  <rect x="644" y="168" width="168" height="64" rx="7" fill="#DCF0E9" stroke="#0E7A63" stroke-width="1.8"/>
  <text x="656" y="190" font-size="13" font-weight="700" fill="#0B4F41">retrieval.py</text>
  <text x="656" y="208" font-size="10" fill="#125F4F" font-family="ui-sans-serif,system-ui,sans-serif">dense + BM25</text>
  <text x="656" y="222" font-size="10" fill="#125F4F" font-family="ui-sans-serif,system-ui,sans-serif">fused by rank</text>

  <rect x="644" y="242" width="168" height="58" rx="7" fill="#F5FCFA" stroke="#A8D5C8"/>
  <text x="656" y="261" font-size="12.5" font-weight="600" fill="#16181D">agent.py</text>
  <rect x="758" y="250" width="44" height="15" rx="7" fill="#E7F0EE"/>
  <text x="780" y="261" font-size="8.5" fill="#0E7A63" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif">claude</text>
  <text x="656" y="278" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">tools.py · 4 tools</text>
  <text x="656" y="292" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">a generator, yields events</text>

  <rect x="644" y="310" width="168" height="48" rx="7" fill="#F5FCFA" stroke="#A8D5C8"/>
  <text x="656" y="329" font-size="12.5" font-weight="600" fill="#16181D">letters.py</text>
  <rect x="758" y="318" width="44" height="15" rx="7" fill="#E7F0EE"/>
  <text x="780" y="329" font-size="8.5" fill="#0E7A63" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif">claude</text>
  <text x="656" y="347" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">grounded drafting</text>

  <rect x="644" y="368" width="168" height="44" rx="7" fill="#F5FCFA" stroke="#A8D5C8"/>
  <text x="656" y="387" font-size="12.5" font-weight="600" fill="#16181D">evaluate.py</text>
  <text x="656" y="403" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">recall@k</text>
</g>

<!-- SURFACES -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect x="852" y="50" width="168" height="108" rx="7" fill="#F6FAFF" stroke="#BDD0F2"/>
  <text x="864" y="70" font-size="12.5" font-weight="600" fill="#16181D">api/ FastAPI</text>
  <g font-size="10" fill="#5E636C">
    <text x="864" y="89">/postings · /filters</text>
    <text x="864" y="104">/chat (SSE) · /letters</text>
    <text x="864" y="119">/inbox · /profile</text>
  </g>
  <text x="864" y="139" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">also reads the db directly</text>
  <text x="864" y="151" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">for list and stats</text>

  <rect x="852" y="176" width="168" height="104" rx="7" fill="#F6FAFF" stroke="#BDD0F2"/>
