<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 464" width="1040" height="464" role="img" aria-labelledby="t d">
<title id="t">Screener architecture</title>
<desc id="d">Five lanes. Job boards, Common Crawl and Gmail feed the ingest layer, which writes into postings.db. The core layer chunks and embeds into vectors.npy and bm25.npz, reads all three back for hybrid retrieval, and drives the agent and the letter drafter. FastAPI serves the React dashboard, and the CLI drives the same core.</desc>

<defs>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L10,5 L0,9 z" fill="#9AA3AE"/>
  </marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L10,5 L0,9 z" fill="#0E7A63"/>
  </marker>
</defs>

<rect x="0" y="0" width="1040" height="464" rx="12" fill="#FBFBF9" stroke="#ECEBE7"/>

<!-- lane bands -->
<g>
  <rect x="12"  y="42" width="184" height="376" rx="10" fill="#F1F4F7"/>
  <rect x="220" y="42" width="184" height="376" rx="10" fill="#FDF6EA"/>
  <rect x="428" y="42" width="184" height="376" rx="10" fill="#F4F0FD"/>
  <rect x="636" y="42" width="184" height="376" rx="10" fill="#EAF5F2"/>
  <rect x="844" y="42" width="184" height="376" rx="10" fill="#EDF2FD"/>
</g>

<g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" font-weight="600" letter-spacing="1.1">
  <text x="20"  y="32" fill="#5B6B7C">OUTSIDE</text>
  <text x="228" y="32" fill="#A26A11">INGEST /</text>
  <text x="436" y="32" fill="#6D3FCF">STORAGE</text>
  <text x="644" y="32" fill="#0E7A63">CORE /</text>
  <text x="852" y="32" fill="#2456C7">SURFACES</text>
</g>

<!-- ============================ connectors ============================ -->
<g stroke="#9AA3AE" stroke-width="1.3" fill="none" stroke-linecap="round">
  <!-- outside -> ingest -->
  <path d="M188,73 H224"  marker-end="url(#ag)"/>
  <path d="M188,249 H224" marker-end="url(#ag)"/>
  <path d="M188,361 H224" marker-end="url(#ag)"/>
  <!-- runner -> normalize -> locations -->
  <path d="M312,96 V106"  marker-end="url(#ag)"/>
  <path d="M312,156 V166" marker-end="url(#ag)"/>
  <!-- ingest write bus into postings.db -->
  <path d="M396,73 H416"/>
  <path d="M396,193 H416"/>
  <path d="M396,249 H416"/>
  <path d="M396,305 H416"/>
  <path d="M396,361 H416"/>
  <path d="M416,73 V361"/>
  <path d="M416,131 H432" marker-end="url(#ag)"/>
  <!-- postings.db <-> chunking -->
  <path d="M608,72 H640" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <!-- embeddings writes the vector store -->
  <path d="M644,131 H628 V240 H608" marker-end="url(#ag)"/>
  <!-- core -> api bus -->
  <path d="M812,271 H832"/>
  <path d="M812,334 H832"/>
  <path d="M832,334 V106"/>
  <path d="M832,106 H848" marker-end="url(#ag)"/>
  <!-- api -> dashboard -->
  <path d="M936,158 V172" marker-end="url(#ag)"/>
</g>

<!-- line jumps: the retrieval path stays unbroken, everything else gives way -->
<g stroke="#FBFBF9" stroke-width="4.5" stroke-linecap="butt">
  <path d="M622,200 H634"/>
  <path d="M614,234 V246"/>
</g>

<!-- the retrieval path -->
<g stroke="#0E7A63" stroke-width="1.6" fill="none" stroke-linecap="round">
  <path d="M608,190 H614"/>
  <path d="M608,270 H614"/>
  <path d="M608,324 H614"/>
  <path d="M614,190 V324"/>
  <path d="M614,200 H640" marker-end="url(#at)"/>
</g>

<!-- cli reaches the same core -->
<path d="M848,350 H818" stroke="#9AA3AE" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ag)"/>

<!-- ============================== boxes ============================== -->
<g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">

<!-- OUTSIDE -->
<g>
  <rect x="20" y="50" width="168" height="90" rx="7" fill="#FFFFFF" stroke="#C9D3DE"/>
  <text x="32" y="70" font-size="12.5" font-weight="600" fill="#16181D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">job boards</text>
  <text x="32" y="89"  font-size="10.5" fill="#5E636C">Greenhouse · Lever</text>
  <text x="32" y="105" font-size="10.5" fill="#5E636C">Ashby · Personio</text>
  <text x="32" y="125" font-size="9.5" fill="#8A8F98">public JSON/XML · 1 req/s</text>

  <rect x="20" y="226" width="168" height="46" rx="7" fill="#FFFFFF" stroke="#C9D3DE"/>
  <text x="32" y="245" font-size="12.5" font-weight="600" fill="#16181D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Common Crawl</text>
  <text x="32" y="262" font-size="9.5" fill="#8A8F98">URL index to tokens</text>

  <rect x="20" y="338" width="168" height="46" rx="7" fill="#FFFFFF" stroke="#C9D3DE"/>
  <text x="32" y="357" font-size="12.5" font-weight="600" fill="#16181D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Gmail API</text>
  <text x="32" y="374" font-size="9.5" fill="#8A8F98">readonly · metadata only</text>
</g>

<!-- INGEST -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect x="228" y="50" width="168" height="46" rx="7" fill="#FFFAF2" stroke="#E9CF9E"/>
  <text x="240" y="69" font-size="12.5" font-weight="600" fill="#16181D">runner.py</text>
  <text x="240" y="86" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">fetch · upsert · reconcile</text>

  <rect x="228" y="110" width="168" height="46" rx="7" fill="#FFFAF2" stroke="#E9CF9E"/>
  <text x="240" y="129" font-size="12.5" font-weight="600" fill="#16181D">normalize.py</text>
  <text x="240" y="146" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">HTML to text · level</text>

  <rect x="228" y="170" width="168" height="46" rx="7" fill="#FFFAF2" stroke="#E9CF9E"/>
  <text x="240" y="189" font-size="12.5" font-weight="600" fill="#16181D">locations.py</text>
  <text x="240" y="206" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">city · country · region</text>

  <rect x="228" y="226" width="168" height="46" rx="7" fill="#FFFAF2" stroke="#E9CF9E"/>
  <text x="240" y="245" font-size="12.5" font-weight="600" fill="#16181D">discovery.py</text>
  <text x="240" y="262" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">verify every token</text>

  <rect x="228" y="282" width="168" height="46" rx="7" fill="#FFFAF2" stroke="#E9CF9E"/>
  <text x="240" y="301" font-size="12.5" font-weight="600" fill="#16181D">profile.py</text>
  <text x="240" y="318" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">write-ups to chunks</text>

  <rect x="228" y="338" width="168" height="46" rx="7" fill="#FFFAF2" stroke="#E9CF9E"/>
  <text x="240" y="357" font-size="12.5" font-weight="600" fill="#16181D">inbox/</text>
  <rect x="342" y="346" width="44" height="15" rx="7" fill="#E7F0EE"/>
  <text x="364" y="357" font-size="8.5" fill="#0E7A63" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif">claude</text>
  <text x="240" y="374" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">oauth · match · classify</text>
</g>

<!-- STORAGE -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect x="436" y="50" width="168" height="162" rx="7" fill="#FAF7FF" stroke="#D3C4F0"/>
  <text x="448" y="70" font-size="12.5" font-weight="600" fill="#16181D">postings.db</text>
  <g font-size="10" fill="#5E636C">
    <text x="448" y="90">postings</text>
    <text x="448" y="105">chunks</text>
    <text x="448" y="120">posting_locations</text>
    <text x="448" y="135">applications</text>
    <text x="448" y="150">status_history</text>
    <text x="448" y="165">companies</text>
    <text x="448" y="180">email_matches</text>
  </g>
  <path d="M448,190 H592" stroke="#E4DBF7" stroke-width="1"/>
  <text x="448" y="204" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">WAL · thread-local conn</text>

  <rect x="436" y="222" width="168" height="64" rx="7" fill="#FAF7FF" stroke="#D3C4F0"/>
  <text x="448" y="242" font-size="12.5" font-weight="600" fill="#16181D">vectors.npy</text>
  <text x="448" y="259" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">float32, one row per chunk</text>
  <text x="448" y="274" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">row = chunks.vector_row</text>

  <rect x="436" y="296" width="168" height="56" rx="7" fill="#FAF7FF" stroke="#D3C4F0"/>
  <text x="448" y="316" font-size="12.5" font-weight="600" fill="#16181D">bm25.npz</text>
  <text x="448" y="333" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">CSR inverted index</text>
  <text x="448" y="346" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">26 s of tokenising, cached</text>

  <rect x="436" y="362" width="168" height="44" rx="7" fill="#FAF7FF" stroke="#D3C4F0"/>
  <text x="448" y="381" font-size="12.5" font-weight="600" fill="#16181D">embed_cache/</text>
  <text x="448" y="397" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">sha256(model + text)</text>
</g>

<!-- CORE -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect x="644" y="50" width="168" height="44" rx="7" fill="#F5FCFA" stroke="#A8D5C8"/>
