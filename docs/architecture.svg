    <text x="864" y="260">/profile · /stats</text>
  </g>

  <rect x="852" y="296" width="168" height="94" rx="7" fill="#F6FAFF" stroke="#BDD0F2"/>
  <text x="864" y="316" font-size="12.5" font-weight="600" fill="#16181D">cli.py</text>
  <g font-size="9" fill="#5E636C">
    <text x="864" y="335">ingest · embed · discover</text>
    <text x="864" y="350">chat · eval · sync-email</text>
    <text x="864" y="365">status · locations</text>
  </g>
  <text x="864" y="382" font-size="9.5" fill="#8A8F98" font-family="ui-sans-serif,system-ui,sans-serif">drives the same core</text>
</g>

<text x="944" y="171" font-size="9.5" fill="#8A8F98">JSON + SSE</text>

<!-- ============================== legend ============================== -->
<g font-size="10" fill="#5E636C">
  <path d="M20,436 H44" stroke="#9AA3AE" stroke-width="1.3" fill="none" marker-end="url(#ag)"/>
  <text x="54" y="440">writes · calls</text>

  <path d="M170,436 H194" stroke="#9AA3AE" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ag)"/>
  <text x="204" y="440">same core, no logic of its own</text>

  <path d="M400,436 H424" stroke="#0E7A63" stroke-width="1.6" fill="none" marker-end="url(#at)"/>
  <text x="434" y="440">the retrieval path, the point of the project</text>

  <rect x="700" y="428" width="44" height="15" rx="7" fill="#E7F0EE"/>
  <text x="722" y="439" font-size="8.5" fill="#0E7A63" text-anchor="middle">claude</text>
  <text x="754" y="440">calls a model, rather than an arrow across the page</text>
</g>

</g>
</svg>
