[project]
name = "agent-app"
version = "0.1.0"
description = "Local agentic app over internship postings"
requires-python = ">=3.11"
dependencies = [
    # HTTP client for the three job-board APIs and the Voyage embeddings API.
    # One client for both, so retry/backoff logic is written once.
    "httpx>=0.27",
    # Vectors: brute-force cosine over a single in-memory array.
    "numpy>=2.0",
    # Reads .env so API keys stay out of the repo.
    "python-dotenv>=1.0",
    # The agent's model client.
    "anthropic>=0.40",
    # API layer.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
agent-app = "agent_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
