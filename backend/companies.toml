# Companies to ingest, grouped by which job board they use.
#
# `token` is the company's board identifier, `name` is what shows in the UI.
# Every token below was verified against the live API; a 404 is reported and
# skipped rather than taking the run down, so a stale token is not urgent.
#
# --- How to find a company's token ------------------------------------------
#
# Open the company's careers page and look at the URL of the job listings.
#
#   Greenhouse  job-boards.greenhouse.io/TOKEN  or  boards.greenhouse.io/TOKEN
#               Some companies embed the board on their own domain; view source
#               and search for "greenhouse.io/" to find the token.
#               Check:  https://boards-api.greenhouse.io/v1/boards/TOKEN/jobs
#
#   Lever       jobs.lever.co/TOKEN
#               Check:  https://api.lever.co/v0/postings/TOKEN?mode=json
#
#   Ashby       jobs.ashbyhq.com/TOKEN
#               Check:  https://api.ashbyhq.com/posting-api/job-board/TOKEN
#
# If the URL returns JSON in the browser, the token is right.

